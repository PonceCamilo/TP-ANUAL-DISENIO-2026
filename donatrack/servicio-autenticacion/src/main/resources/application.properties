spring.application.name=servicio-autenticacion
server.port=8088
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5434/autenticacion_db}
spring.datasource.username=${AUTH_DB_USER:donatrack}
spring.datasource.password=${AUTH_DB_PASSWORD:donatrack}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false
server.error.include-message=always
donatrack.auth.google-client-id=${GOOGLE_CLIENT_ID:}
donatrack.auth.clave-privada=${AUTH_KEY_FILE:}
donatrack.auth.clave-frontend=${AUTH_FRONTEND_KEY:}
# Clave que comparten los servicios (X-DonaTrack-Servicio). La usa Donaciones para
# avisar las personas que cargó la administración. Vacía: se rechazan esos avisos.
donatrack.auth.clave-servicios=${DONATRACK_SERVICIOS_KEY:}

# Enlaces de activación (requisito 20): dirección pública del front para armar el
# enlace del correo, y cuánto dura.
donatrack.auth.frontend-url=${FRONTEND_URL:http://localhost:8080}
donatrack.auth.activacion.vigencia=PT24H

# Correo del enlace de activación. Mismas variables que el Servicio de
# Notificaciones. Sin MAIL_HOST no se manda nada; para probar en local sin SMTP,
# AUTH_ENLACE_EN_LOG=true muestra el enlace en el log (nunca en producción).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
donatrack.auth.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}
donatrack.auth.correo.mostrar-enlace-en-log=${AUTH_ENLACE_EN_LOG:false}
