# Configuración SOLO para los tests.
#
# Los tests que levantan el contexto (@SpringBootTest, @WebMvcTest) no deben
# depender de que haya un PostgreSQL corriendo: usan H2 en memoria, que además
# verifica que el esquema generado desde las entidades sea válido.
spring.datasource.url=jdbc:h2:mem:donaciones_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create-drop: cada corrida arranca con el esquema recién generado. Si una
# entidad queda mal mapeada, el contexto falla acá y no en producción.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Las migraciones no corren en cada contexto (create-drop deja cada uno con su
# esquema limpio): las prueban MigracionesTest, que las aplica sobre una base
# vacía y valida el esquema contra las entidades, y MigracionDeDatosTest, que
# migra datos guardados con el esquema de la Entrega 5.
spring.flyway.enabled=false

# Sin bloqueo de tareas: los tests llaman a los procesos directamente y la tabla
# shedlock la crea una migración. Lo prueba BloqueoDeTareasTest.
donaciones.procesos.bloqueo-distribuido=false

# Mismas escrituras por lotes que en producción, para que las mediciones sean comparables.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Y las mismas lecturas por lotes (las colecciones son diferidas).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# El transporte REST es el predeterminado: los tests no necesitan un RabbitMQ.
notificaciones.transporte=rest

# El relay de la bandeja de salida no corre de fondo en los tests: las mediciones
# de consultas cuentan sentencias de toda la aplicación. Los tests lo invocan a mano.
donaciones.salida.habilitada=false
