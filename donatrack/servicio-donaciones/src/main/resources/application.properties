spring.application.name=servicio-donaciones
server.port=8081

# ── Persistencia (Entrega 4) ───────────────────────────────────────────────
# Una base por servicio dentro de un servidor PostgreSQL compartido: cada
# microservicio es dueño de sus datos y nadie lee las tablas de otro. Es lo que
# permite que cada uno tenga su propio DER.
#
# El 5433 es el puerto que publica el contenedor postgres en el host (el 5432
# suele estar tomado por un PostgreSQL instalado localmente). En Docker el
# compose sobreescribe esta URL para usar el nombre de red y el 5432.
#
# Las credenciales no se escriben en el código: se toman de variables de
# entorno, y el valor después de ':' es el default para correr en local con el
# docker-compose del proyecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/donaciones_db}
spring.datasource.username=${DB_USUARIO:donatrack}
spring.datasource.password=${DB_CLAVE:donatrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Esquema: migraciones de Flyway (Entrega 5) ────────────────────────────
# El esquema lo crean y lo cambian las migraciones versionadas (db/migration):
# V1 es el esquema de la Entrega 5 y cada cambio posterior es una versión nueva,
# que se aplica una sola vez y queda registrada en flyway_schema_history.
# Hibernate ya no toca el esquema: solo valida al arrancar que coincida con las
# entidades, así un mapeo sin su migración se detecta antes de atender pedidos.
# Antes era ddl-auto=update, que agrega columnas pero nunca borra ni migra datos.
#
# Una base creada antes de las migraciones (con ddl-auto=update) ya tiene el
# esquema de la versión 1: se la marca en esa versión y se le aplican las demás.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# ── Escrituras por lotes (Entrega 5) ───────────────────────────────────────
# Agrupa los INSERT y UPDATE del mismo tipo en lotes de 50 sentencias por
# viaje a la base. Lo aprovecha sobre todo la importación masiva por CSV, que
# guarda de a 500 personas. Funciona porque los ids son UUID asignados por la
# aplicación: con ids autoincrementales (IDENTITY) Hibernate no puede agrupar.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Lecturas por lotes (Entrega 5) ─────────────────────────────────────────
# Las colecciones (bienes, historial, contactos, representantes, campañas,
# necesidades) se cargan de forma diferida: se leen recién cuando algo las usa,
# así un caso de uso que no las necesita no las paga. Cuando se usan, Hibernate
# trae las de hasta 100 dueños en una sola consulta (WHERE ... IN (...)) en
# lugar de una consulta por dueño, que sería el problema N+1. Al ser un valor
# global, una colección nueva queda cubierta sin tener que anotarla.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ── Integración con el Servicio de Notificaciones ──────────────────────────
# Transporte: "rest" (sincrónico, HTTP) o "amqp" (asincrónico, cola RabbitMQ).
#
# Queda en "rest" para correr el servicio suelto desde el IDE sin necesitar un
# RabbitMQ levantado. En Docker el compose lo pone en "amqp", que es el modo que
# pide la Entrega 4.
notificaciones.transporte=rest

# URL usada solo por el transporte REST (POST /notificaciones)
notificaciones.url=http://localhost:8084

# Conexión a RabbitMQ, usada solo por el transporte AMQP
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USUARIO:guest}
spring.rabbitmq.password=${RABBITMQ_CLAVE:guest}
# El broker confirma cada publicación (NotificacionTransportAmqp espera la
# confirmación): si no confirma, el aviso se reintenta desde la bandeja de salida.
spring.rabbitmq.publisher-confirm-type=simple

# URL del servicio-incentivos (POST /api/incentivos/donantes/...)
servicios.incentivos.url=http://localhost:8083

# ── Broker de integración con logística (Entrega 4) ────────────────────────
# Donaciones no habla directo con ningún servicio de logística: le manda las
# donaciones al broker (POST /api/broker/envios) y el broker elige el proveedor
# (DONATRACK o EXTERNA) y hace fallback si el primero no está disponible.
servicios.broker-logistica.url=http://localhost:8087

# Timeouts de los clientes HTTP hacia los otros servicios (los aplica el
# RestClient.Builder de Spring Boot). Sin ellos, un servicio lento dejaba colgado
# el hilo que lo llamaba.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

# ── Observabilidad (Entrega 5) ─────────────────────────────────────────────
# /actuator/health para el healthcheck del contenedor (con /liveness y
# /readiness), /actuator/info y /actuator/metrics. Los demás endpoints de
# Actuator no se exponen.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# RabbitMQ no cuenta para la salud del servicio: si no está, los avisos esperan
# en la bandeja de salida y se reintentan, y el servicio sigue atendiendo.
management.health.rabbit.enabled=false
# Cada línea de log lleva el id de correlación del pedido (IdDeCorrelacion).
logging.pattern.level=%5p [%X{correlationId:-}]

# El parent incluye spring-boot-docker-compose, que al arrancar busca un
# compose.yaml y trata de levantar los contenedores por su cuenta. Se desactiva
# porque el stack lo maneja docker compose a mano: si queda activo, el servicio
# intenta administrar el compose desde adentro del contenedor.
spring.docker.compose.enabled=false

# ── Parámetros del servicio (DonacionesProperties) ─────────────────────────
# Se validan al arrancar. Los valores de abajo son los defaults: se dejan
# escritos para que la configuración quede documentada en un solo lugar.

# Aviso a donantes sin interacción (el enunciado fija 20 días).
donaciones.inactividad.dias=20
donaciones.inactividad.cron=0 0 0 * * *
donaciones.inactividad.tamanio-lote=100

# Procesos nocturnos, en hora de Argentina: reconciliación del contador de
# recepciones, matchmaking y despacho a logística, en ese orden.
donaciones.procesos.cron-reconciliacion=0 0 3 * * *
donaciones.procesos.cron-matchmaking=0 30 3 * * *
donaciones.procesos.cron-despacho=0 0 4 * * *
# El matchmaking y el despacho recorren las donaciones de a lotes, cada uno en
# una transacción corta, en lugar de cargarlas todas juntas.
donaciones.procesos.tamanio-lote=100
# Cada tarea programada toma un bloqueo en la base (tabla shedlock) antes de
# correr: con dos instancias del servicio, el proceso nocturno y el relay de la
# bandeja de salida corren en una sola.
donaciones.procesos.bloqueo-distribuido=true

# Importación masiva por CSV: filas por transacción y cuántos errores se
# detallan en la respuesta (los demás solo se cuentan).
donaciones.importacion.tamanio-lote=500
donaciones.importacion.max-errores-en-respuesta=100

# Límite de subida de archivos. El de Spring es 1 MB, y el CSV de 20.000 filas
# del enunciado pesa 1,7 MB: con el límite por defecto la importación fallaba.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Destinatario de las alertas operativas (entregas fallidas).
donaciones.notificaciones.email-admin=admin@donatrack.org

# Cuántas entidades candidatas devuelve cada algoritmo de asignación.
donaciones.matchmaking.tamanio-ranking=10

# Bandeja de salida (outbox): los avisos se guardan con el cambio que los origina
# y un relay los envía y reintenta.
donaciones.salida.habilitada=true
donaciones.salida.intervalo-ms=5000
donaciones.salida.tamanio-lote=50
donaciones.salida.max-intentos=10
donaciones.salida.dias-retencion=7
donaciones.salida.cron-limpieza=0 30 4 * * *
