spring.application.name=servicio-donaciones
server.port=8081

# ── Persistencia (Entrega 4) ───────────────────────────────────────────────
# Una base por servicio dentro de un servidor PostgreSQL compartido: cada
# microservicio es dueño de sus datos y nadie lee las tablas de otro. Es lo que
# permite que cada uno tenga su propio DER.
#
# El 5433 es el puerto que publica el contenedor postgres en el host (el 5432
# suele estar tomado por un PostgreSQL instalado localmente). En Docker el
# compose sobreescribe esta URL para usar el nombre de red y el 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/donaciones_db
spring.datasource.username=donatrack
spring.datasource.password=donatrack
spring.datasource.driver-class-name=org.postgresql.Driver

# update y no create-drop: los datos sobreviven al reinicio del servicio, que es
# lo que se espera de una base real. El esquema se genera desde las entidades,
# y de ahí sale el DER físico que pide la entrega.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Integración con el Servicio de Notificaciones ──────────────────────────
# Transporte: "rest" (sincrónico, HTTP) o "amqp" (asincrónico, cola RabbitMQ).
#
# Queda en "rest" para correr el servicio suelto desde el IDE sin necesitar un
# RabbitMQ levantado. En Docker el compose lo pone en "amqp", que es el modo que
# pide la Entrega 4.
notificaciones.transporte=rest

# URL usada solo por el transporte REST (POST /notificaciones)
notificaciones.url=http://localhost:8084

# Conexión a RabbitMQ, usada solo por el transporte AMQP
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# URL del servicio-incentivos (POST /api/incentivos/donantes/...)
servicios.incentivos.url=http://localhost:8083

# ── Broker de integración con logística (Entrega 4) ────────────────────────
# Donaciones no habla directo con ningún servicio de logística: le manda las
# donaciones al broker (POST /api/broker/envios) y el broker elige el proveedor
# (DONATRACK o EXTERNA) y hace fallback si el primero no está disponible.
servicios.broker-logistica.url=http://localhost:8087

# El parent incluye spring-boot-docker-compose, que al arrancar busca un
# compose.yaml y trata de levantar los contenedores por su cuenta. Se desactiva
# porque el stack lo maneja docker compose a mano: si queda activo, el servicio
# intenta administrar el compose desde adentro del contenedor.
spring.docker.compose.enabled=false
