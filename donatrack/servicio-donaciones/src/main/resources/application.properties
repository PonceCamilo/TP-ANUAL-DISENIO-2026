spring.application.name=servicio-donaciones
server.port=8081

# ── Persistencia (Entrega 4) ───────────────────────────────────────────────
# Una base por servicio dentro de un servidor PostgreSQL compartido: cada
# microservicio es dueño de sus datos y nadie lee las tablas de otro. Es lo que
# permite que cada uno tenga su propio DER.
#
# El 5433 es el puerto que publica el contenedor postgres en el host (el 5432
# suele estar tomado por un PostgreSQL instalado localmente). En Docker el
# compose sobreescribe esta URL para usar el nombre de red y el 5432.
#
# Las credenciales no se escriben en el código: se toman de variables de
# entorno, y el valor después de ':' es el default para correr en local con el
# docker-compose del proyecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/donaciones_db}
spring.datasource.username=${DB_USUARIO:donatrack}
spring.datasource.password=${DB_CLAVE:donatrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# update y no create-drop: los datos sobreviven al reinicio del servicio, que es
# lo que se espera de una base real. El esquema se genera desde las entidades,
# y de ahí sale el DER físico que pide la entrega.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Escrituras por lotes (Entrega 5) ───────────────────────────────────────
# Agrupa los INSERT y UPDATE del mismo tipo en lotes de 50 sentencias por
# viaje a la base. Lo aprovecha sobre todo la importación masiva por CSV, que
# guarda de a 500 personas. Funciona porque los ids son UUID asignados por la
# aplicación: con ids autoincrementales (IDENTITY) Hibernate no puede agrupar.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Integración con el Servicio de Notificaciones ──────────────────────────
# Transporte: "rest" (sincrónico, HTTP) o "amqp" (asincrónico, cola RabbitMQ).
#
# Queda en "rest" para correr el servicio suelto desde el IDE sin necesitar un
# RabbitMQ levantado. En Docker el compose lo pone en "amqp", que es el modo que
# pide la Entrega 4.
notificaciones.transporte=rest

# URL usada solo por el transporte REST (POST /notificaciones)
notificaciones.url=http://localhost:8084

# Conexión a RabbitMQ, usada solo por el transporte AMQP
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USUARIO:guest}
spring.rabbitmq.password=${RABBITMQ_CLAVE:guest}

# URL del servicio-incentivos (POST /api/incentivos/donantes/...)
servicios.incentivos.url=http://localhost:8083

# ── Broker de integración con logística (Entrega 4) ────────────────────────
# Donaciones no habla directo con ningún servicio de logística: le manda las
# donaciones al broker (POST /api/broker/envios) y el broker elige el proveedor
# (DONATRACK o EXTERNA) y hace fallback si el primero no está disponible.
servicios.broker-logistica.url=http://localhost:8087

# El parent incluye spring-boot-docker-compose, que al arrancar busca un
# compose.yaml y trata de levantar los contenedores por su cuenta. Se desactiva
# porque el stack lo maneja docker compose a mano: si queda activo, el servicio
# intenta administrar el compose desde adentro del contenedor.
spring.docker.compose.enabled=false

# ── Parámetros del servicio (DonacionesProperties) ─────────────────────────
# Se validan al arrancar. Los valores de abajo son los defaults: se dejan
# escritos para que la configuración quede documentada en un solo lugar.

# Aviso a donantes sin interacción (el enunciado fija 20 días).
donaciones.inactividad.dias=20
donaciones.inactividad.cron=0 0 0 * * *

# Procesos nocturnos, en hora de Argentina: reconciliación del contador de
# recepciones, matchmaking y despacho a logística, en ese orden.
donaciones.procesos.cron-reconciliacion=0 0 3 * * *
donaciones.procesos.cron-matchmaking=0 30 3 * * *
donaciones.procesos.cron-despacho=0 0 4 * * *

# Importación masiva por CSV: filas por transacción y cuántos errores se
# detallan en la respuesta (los demás solo se cuentan).
donaciones.importacion.tamanio-lote=500
donaciones.importacion.max-errores-en-respuesta=100

# Límite de subida de archivos. El de Spring es 1 MB, y el CSV de 20.000 filas
# del enunciado pesa 1,7 MB: con el límite por defecto la importación fallaba.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Destinatario de las alertas operativas (entregas fallidas).
donaciones.notificaciones.email-admin=admin@donatrack.org
