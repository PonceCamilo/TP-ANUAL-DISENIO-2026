spring.application.name=servicio-donaciones
server.port=8081

# ── Integración con el Servicio de Notificaciones ──────────────────────────
# Transporte: "rest" (sincrónico, HTTP) o "amqp" (asincrónico, cola RabbitMQ).
#
# Queda en "rest" por defecto a propósito: el consumidor de la cola todavía no
# existe del lado de servicio-notificaciones. Cuando ese @RabbitListener esté
# implementado, se cambia este valor a "amqp" y se levanta RabbitMQ.
notificaciones.transporte=rest

# URL usada solo por el transporte REST (POST /notificaciones)
notificaciones.url=http://localhost:8084

# Conexión a RabbitMQ, usada solo por el transporte AMQP
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# URL del servicio-incentivos (POST /api/incentivos/donantes/...)
servicios.incentivos.url=http://localhost:8083

# ── Broker de integración con logística (Entrega 4) ────────────────────────
# A qué proveedor se le ofrece primero la planificación. Si no está disponible
# o rechaza el trabajo, el broker pasa automáticamente al siguiente.
logistica.proveedor.preferido=propia

# Proveedor 1: el servicio de logística propio del sistema
logistica.propia.url=http://localhost:8085

# Proveedor 2: operador tercerizado. Deshabilitado hasta que exista un servicio
# real detrás; con esto en true el broker ya lo considera como alternativa.
logistica.tercerizada.habilitado=false
logistica.tercerizada.url=http://localhost:9090

# El parent incluye spring-boot-docker-compose; sin un compose.yaml el arranque
# falla. Como los servicios usan repositorios en memoria, se desactiva.
spring.docker.compose.enabled=false
