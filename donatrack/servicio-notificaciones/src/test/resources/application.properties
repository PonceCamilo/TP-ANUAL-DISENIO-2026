# Configuración SOLO para los tests.
#
# H2 en memoria: los tests que levantan el contexto no dependen de que haya un
# PostgreSQL corriendo, y además se verifica que el esquema generado desde las
# entidades sea válido.
spring.datasource.url=jdbc:h2:mem:notificaciones_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# No arrancar el listener de la cola en los tests: no hay un RabbitMQ corriendo
# y reintentaría la conexión llenando el log de "Connection refused".
spring.rabbitmq.listener.simple.auto-startup=false

# Credenciales vacías: los tests nunca envían de verdad.
notificaciones.discord.webhook-url=
twilio.account-sid=
twilio.auth-token=
twilio.sms-from-number=
twilio.whatsapp-from-number=
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
