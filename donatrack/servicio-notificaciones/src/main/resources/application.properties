spring.application.name=servicio-notificaciones
server.port=8084

# ── Persistencia (Entrega 4) ───────────────────────────────────────────────
# Base propia dentro del servidor PostgreSQL compartido del compose.
# El 5433 es el puerto que ese contenedor publica en el host; en Docker el
# compose sobreescribe la URL para usar el nombre de red y el 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/notificaciones_db
spring.datasource.username=donatrack
spring.datasource.password=donatrack
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Cola de mensajes ───────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ── Credenciales de los canales reales ─────────────────────────────────────
# POR QUÉ ESTÁN VACÍAS Y DECLARADAS:
# los @Value de los notificadores no tenían valor por defecto y estas
# properties no existían, así que Spring fallaba al arrancar con
# "Could not resolve placeholder". El servicio moría con exit 1 y ningún test
# lo detectaba porque ninguno levanta el contexto.
#
# Declararlas vacías permite que el contexto cargue. Cada notificador falla
# recién al intentar enviar, lo loguea y marca la notificación como FALLIDA,
# que es el comportamiento correcto para una credencial ausente.
#
# Los valores reales se pasan por variable de entorno, NO se commitean.
notificaciones.discord.webhook-url=${DISCORD_WEBHOOK_URL:}

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.sms-from-number=${TWILIO_SMS_FROM:}
twilio.whatsapp-from-number=${TWILIO_WHATSAPP_FROM:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# El parent incluye spring-boot-docker-compose; sin un compose.yaml el arranque
# falla. El compose real lo maneja Docker, no Spring.
spring.docker.compose.enabled=false
