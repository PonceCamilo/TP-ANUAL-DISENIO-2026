spring.application.name=servicio-incentivos
server.port=8083

# ── Persistencia (Entrega 4) ───────────────────────────────────────────────
# Base propia dentro del servidor PostgreSQL compartido del compose.
# El 5433 es el puerto que ese contenedor publica en el host; en Docker el
# compose sobreescribe la URL para usar el nombre de red y el 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/incentivos_db
spring.datasource.username=donatrack
spring.datasource.password=donatrack
spring.datasource.driver-class-name=org.postgresql.Driver

# update y no create-drop: los datos sobreviven al reinicio del servicio.
# El esquema se genera desde las entidades y de ahí sale el DER físico.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── Transporte de notificaciones ───────────────────────────────────────────
# "rest" (sincrónico) o "amqp" (asincrónico, cola RabbitMQ).
# Queda en "rest" para poder correr el servicio suelto desde el IDE sin
# RabbitMQ; en Docker el compose lo pone en "amqp".
notificaciones.transporte=rest

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# URL del servicio-notificaciones (se puede sobreescribir con variable de entorno)
servicios.notificaciones.url=http://localhost:8084

# URL del webhook de n8n que dispara la automatización de insignias
# (generación de imagen + publicación en la red social elegida)
integraciones.n8n.webhook.url=http://localhost:5678/webhook/insignia-obtenida

# El parent incluye spring-boot-docker-compose; sin un compose.yaml el arranque
# falla. Como los servicios usan repositorios en memoria, se desactiva.
spring.docker.compose.enabled=false
