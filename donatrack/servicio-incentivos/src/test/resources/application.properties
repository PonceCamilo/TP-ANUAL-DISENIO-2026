# Configuración SOLO para los tests.
#
# Los tests que levantan el contexto no deben depender de que haya un PostgreSQL
# corriendo: usan H2 en memoria, que además verifica que el esquema generado
# desde las entidades sea válido.
spring.datasource.url=jdbc:h2:mem:incentivos_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create-drop: cada corrida arranca con el esquema recién generado. Si una
# entidad queda mal mapeada, el contexto falla acá y no en producción.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Transporte REST: los tests no necesitan un RabbitMQ levantado.
notificaciones.transporte=rest
