spring.application.name=servicio-logistica-externa
server.port=8086

# Detras del proxy de Railway: respeta X-Forwarded-Proto para que Swagger use https.
server.forward-headers-strategy=framework

# Webhook al que este proveedor avisa cada cambio de estado de un envio
# (EN_CAMINO, ENTREGADO, FALLIDO). Apunta al broker de logistica, que lo
# traduce al formato que espera servicio-donaciones. Vacio = no avisa.
logistica-externa.webhook.url=http://localhost:8087/api/broker/eventos/externa

# Base del link de seguimiento que se incluye en las respuestas y eventos.
logistica-externa.tracking-base-url=http://localhost:8086/api/v1/envios/

logistica-externa.dias-estimados-entrega=2

# Health check para el broker de logistica.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# El parent incluye spring-boot-docker-compose; sin un compose.yaml el arranque
# falla. Como los servicios usan repositorios en memoria, se desactiva.
spring.docker.compose.enabled=false
