spring.application.name=servicio-broker-logistica
server.port=8087

# Servicio de Donaciones: destino de los eventos de entrega (callbacks
# /logistica/eventos/...). Reemplaza al relay que antes hacia n8n.
broker.donaciones.url=http://localhost:8081

# Proveedores de logistica disponibles.
broker.proveedores.donatrack.url=http://localhost:8085
broker.proveedores.externa.url=http://localhost:8086

# Orden en que se ofrecen los pedidos cuando Donaciones no indica proveedor.
# Si el primero no esta disponible, se prueba el siguiente (fallback).
broker.proveedores.prioridad=DONATRACK,EXTERNA

# Timeouts de las llamadas HTTP salientes (proveedores y Donaciones).
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=10s

# Health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# El parent incluye spring-boot-docker-compose; sin un compose.yaml el arranque
# falla. Como los servicios usan repositorios en memoria, se desactiva.
spring.docker.compose.enabled=false
