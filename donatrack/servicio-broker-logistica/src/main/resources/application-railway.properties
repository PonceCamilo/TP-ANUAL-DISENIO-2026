# Perfil "railway": el broker corre local y los dos proveedores de logistica
# estan desplegados en Railway. Activar con:
#   mvn spring-boot:run -Dspring-boot.run.profiles=railway
# Solo pisa las URLs de los proveedores; el resto sale de application.properties.
# Los eventos de vuelta (logistica -> broker) no llegan en este esquema: los
# servicios desplegados no pueden alcanzar al broker que corre en la maquina local.

broker.proveedores.donatrack.url=https://donatrack-logistica-production.up.railway.app
broker.proveedores.externa.url=https://logistica-externa-production.up.railway.app

# Railway puede tardar en responder si el servicio recien se reactiva.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s
