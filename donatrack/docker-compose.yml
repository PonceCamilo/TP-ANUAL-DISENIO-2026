services:

  # Base de datos de servicio-donaciones (Entrega 4).
  # Una base por servicio: cada microservicio es dueño de sus datos y nadie
  # lee las tablas de otro. Cuando los demás servicios agreguen persistencia,
  # cada uno suma su propio contenedor con su propio volumen.
  db-donaciones:
    image: postgres:16-alpine
    container_name: donatrack-db-donaciones
    environment:
      POSTGRES_DB: donatrack_donaciones
      POSTGRES_USER: donatrack
      POSTGRES_PASSWORD: donatrack
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente.
      - "5433:5432"
    volumes:
      - datos-donaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donatrack -d donatrack_donaciones"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - donatrack-net

  servicio-donaciones:
    build:
      # El contexto es la raíz del reactor para que Maven encuentre el POM padre.
      context: .
      dockerfile: servicio-donaciones/Dockerfile
    container_name: donatrack-donaciones
    ports:
      - "8081:8081"
    environment:
      - notificaciones.url=http://servicio-notificaciones:8084
      - servicios.incentivos.url=http://servicio-incentivos:8083
      - servicios.broker-logistica.url=http://servicio-broker-logistica:8087
      - spring.datasource.url=jdbc:postgresql://db-donaciones:5432/donatrack_donaciones
      - spring.docker.compose.enabled=false
    depends_on:
      # service_healthy y no solo depends_on: el servicio arranca recién cuando
      # la base acepta conexiones, si no Hibernate falla al generar el esquema.
      db-donaciones:
        condition: service_healthy
      servicio-notificaciones:
        condition: service_started
      servicio-broker-logistica:
        condition: service_started
    networks:
      - donatrack-net

  servicio-notificaciones:
    build:
      context: .
      dockerfile: servicio-notificaciones/Dockerfile
    container_name: donatrack-notificaciones
    ports:
      - "8084:8084"
    environment:
      - spring.docker.compose.enabled=false
    networks:
      - donatrack-net

  servicio-incentivos:
    build:
      context: .
      dockerfile: servicio-incentivos/Dockerfile
    container_name: donatrack-servicio-incentivos
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SERVICIOS_NOTIFICACIONES_URL: http://servicio-notificaciones:8084
      INTEGRACIONES_N8N_WEBHOOK_URL: http://host.docker.internal:5678/webhook/insignia-obtenida
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      - servicio-notificaciones
    networks:
      - donatrack-net

  servicio-logistica:
    build:
      context: .
      dockerfile: servicio-logistica/Dockerfile
    container_name: donatrack-servicio-logistica
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      INTEGRACIONES_PROVEEDOR_RUTEO_URL: http://localhost:8085/ruteo/planificar
      INTEGRACIONES_BROKER_EVENTOS_URL: http://servicio-broker-logistica:8087/api/broker/eventos/donatrack
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    networks:
      - donatrack-net

  # Segundo proveedor de logistica (de terceros), independiente de
  # servicio-logistica: el broker elige entre ambos.
  servicio-logistica-externa:
    build:
      context: .
      dockerfile: servicio-logistica-externa/Dockerfile
    container_name: donatrack-servicio-logistica-externa
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      LOGISTICA_EXTERNA_WEBHOOK_URL: http://servicio-broker-logistica:8087/api/broker/eventos/externa
      LOGISTICA_EXTERNA_TRACKING_BASE_URL: http://localhost:8086/api/v1/envios/
    networks:
      - donatrack-net

  # Broker de integracion Donaciones <-> logistica: elige el proveedor para
  # cada pedido y reenvia a Donaciones los eventos de ambos (reemplaza al
  # relay de n8n de logistica).
  servicio-broker-logistica:
    build:
      context: .
      dockerfile: servicio-broker-logistica/Dockerfile
    container_name: donatrack-servicio-broker-logistica
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      BROKER_DONACIONES_URL: http://servicio-donaciones:8081
      BROKER_PROVEEDORES_DONATRACK_URL: http://servicio-logistica:8085
      BROKER_PROVEEDORES_EXTERNA_URL: http://servicio-logistica-externa:8086
      BROKER_PROVEEDORES_PRIORIDAD: DONATRACK,EXTERNA
    networks:
      - donatrack-net

networks:
  donatrack-net:
    driver: bridge

volumes:
  # Los datos sobreviven a docker compose down. Para arrancar de cero:
  # docker compose down -v
  datos-donaciones:
