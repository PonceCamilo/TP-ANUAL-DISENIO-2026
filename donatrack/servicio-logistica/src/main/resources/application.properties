spring.application.name=servicio-logistica
server.port=8085

# Detras del proxy de Railway: respeta X-Forwarded-Proto para que Swagger use https.
server.forward-headers-strategy=framework

# URL del proveedor externo de planificacion de rutas. Se llama una vez por
# lote, con todas las donaciones y todos los camiones, y responde en el mismo
# request/response las rutas de los camiones usados (sin callback de por medio).
# Apunta al MockProveedorRuteoController (misma app, puerto 8085) para poder
# probar el flujo en local sin levantar un proveedor real.
integraciones.proveedor-ruteo.url=http://localhost:8085/ruteo/planificar

# Maximo de donaciones que el proveedor externo procesa por lote
integraciones.proveedor-ruteo.max-donaciones-por-lote=100

# URL del broker de logistica (servicio-broker-logistica) al que se publican
# los eventos (inicio de ruta, entrega confirmada, entrega no recibida).
# servicio-logistica NO llama a Donaciones ni a Notificaciones directamente:
# solo publica el evento en el broker, que lo reenvia a Donaciones.
integraciones.broker.eventos.url=http://localhost:8087/api/broker/eventos/donatrack

# El parent incluye spring-boot-docker-compose; sin un compose.yaml en esta
# carpeta el arranque falla. Las bases se levantan con el compose de donatrack/.
spring.docker.compose.enabled=false

# Base documental `logistica`: colecciones camiones, lotes y rutas.
# directConnection evita que el driver persiga el host anunciado por el replica
# set (127.0.0.1 dentro del contenedor) y se conecte al host de esta URI.
# El replica set de un solo nodo habilita la transacción entre documentos
# (ruta y camión, lote y rutas).
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/logistica?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# Health check para el broker de logistica.
# Solo se expone /actuator/health (UP/DOWN), sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
