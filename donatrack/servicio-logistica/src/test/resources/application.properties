# Configuración SOLO para los tests.
#
# En ejecución el esquema lo crea Flyway (src/main/resources/db/migration) sobre
# PostgreSQL, y ddl-auto queda en "validate". Para los tests eso no sirve: la
# migración es específica de PostgreSQL y no hay un servidor corriendo.
#
# Acá se usa H2 en memoria, se apaga Flyway y se deja que Hibernate genere el
# esquema desde las entidades. Es suficiente para verificar que el contexto
# levanta y que el mapeo es válido.
spring.datasource.url=jdbc:h2:mem:logistica_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# OJO: este archivo REEMPLAZA al application.properties principal cuando corren
# los tests, no lo complementa. Por eso hay que repetir acá toda property que el
# código necesite resolver, aunque no tenga nada que ver con la base de datos.
integraciones.proveedor-ruteo.url=http://localhost:8085/ruteo/planificar
integraciones.proveedor-ruteo.max-donaciones-por-lote=100
integraciones.broker.eventos.url=http://localhost:8087/api/broker/eventos/donatrack
