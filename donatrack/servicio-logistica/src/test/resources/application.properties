# Configuración SOLO para los tests. Este archivo REEMPLAZA al
# application.properties principal: hay que repetir toda property que el
# código necesite resolver.
spring.docker.compose.enabled=false

# MongoDB embebido (de.flapdoodle), en replica set para que @Transactional
# pueda abrir una transacción de varios documentos.
spring.data.mongodb.auto-index-creation=true
de.flapdoodle.mongodb.embedded.version=7.0.14
de.flapdoodle.mongodb.embedded.storage.repl-set-name=rs0
de.flapdoodle.mongodb.embedded.storage.oplog-size=10MB

integraciones.proveedor-ruteo.url=http://localhost:8085/ruteo/planificar
integraciones.proveedor-ruteo.max-donaciones-por-lote=100
integraciones.broker.eventos.url=http://localhost:8087/api/broker/eventos/donatrack
